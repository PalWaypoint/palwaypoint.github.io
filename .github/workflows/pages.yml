name: Publish PalWaypoint

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site files
        uses: actions/checkout@v4
      - name: Prepare map and terrain
        run: |
          mkdir -p _site
          cp index.html coordinates.js elevation.js map-config.js map.js style.css world-map.webp _site/
          unzip -q terrain.zip -d _site
          test -f _site/index.html
          test -f _site/terrain/4/0/0.png
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

