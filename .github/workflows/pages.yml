name: Publish PalWaypoint

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site files
        uses: actions/checkout@v4
      - name: Prepare map and terrain
        run: |
          mkdir -p _site
          cp index.html coordinates.js elevation.js map-config.js map.js markers.js marker-categories.json markers.json tree-markers.json chest-tips.json style.css world-map.webp tree-map.webp MARKER-DATA-LICENSE.txt _site/
          cp presence.js presence-config.js presence.css _site/
          cp map-guide.html robots.txt sitemap.xml favicon.svg _site/
          cp wiki.html wiki.js wiki.css wiki-logic.js wiki-data.json WIKI-DATA-LICENSE.txt _site/
          if [ -f base-builder.js ]; then
            cp base-builder.js base-builder.css base-storage.js base-logic.js base-data.json _site/
          fi
          if [ -f base-scene.js ]; then
            cp base-scene.js base-snapping.js base-visuals.json _site/
          fi
          if [ -f team-builder.js ]; then
            cp team-builder.js team-logic.js team-storage.js team-data.json _site/
          fi
          if [ -f progress-backup.js ]; then
            cp progress-backup.js effigies.json _site/
          fi
          if [ -f loot-tables.json ]; then
            cp map-links.js chest-loot.js loot-tables.json _site/
          fi
          if [ -f pal-habitats.js ]; then
            cp pal-habitats.js pal-spawns.json _site/
          fi
          if [ -f player-tools.zip ]; then
            unzip -q player-tools.zip -d _site
          fi
          if [ -f base-assets-01.zip ]; then unzip -q base-assets-01.zip -d _site; fi
          if [ -f base-assets-02.zip ]; then unzip -q base-assets-02.zip -d _site; fi
          if [ -f base-assets-03.zip ]; then unzip -q base-assets-03.zip -d _site; fi
          if [ -f base-assets-04.zip ]; then unzip -q base-assets-04.zip -d _site; fi
          if [ -f base-assets-05.zip ]; then unzip -q base-assets-05.zip -d _site; fi
          if [ -f base-assets-06.zip ]; then unzip -q base-assets-06.zip -d _site; fi
          if [ -f base-assets-07.zip ]; then unzip -q base-assets-07.zip -d _site; fi
          if [ -f base-assets-08.zip ]; then unzip -q base-assets-08.zip -d _site; fi
          if [ -f base-assets-09.zip ]; then unzip -q base-assets-09.zip -d _site; fi
          if [ -f base-assets-10.zip ]; then unzip -q base-assets-10.zip -d _site; fi
          if [ -f base-assets-11.zip ]; then unzip -q base-assets-11.zip -d _site; fi
          unzip -q marker-icons.zip -d _site
          unzip -q terrain.zip -d _site
          unzip -q terrain-tree.zip -d _site
          test -f _site/map-guide.html
          test -f _site/robots.txt
          test -f _site/sitemap.xml
          test -f _site/favicon.svg
          test -f _site/index.html
          test -f _site/terrain/4/0/0.png
          test -f _site/terrain-tree/4/0/0.png
          test -f _site/icons/palwaypoint/fast-travel.svg
          test -f _site/icons/item-art/sources.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
